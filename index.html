<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-15QKDYFPHD"></script>

    <meta name="google-site-verification" content="VBjIJDwLcQvXehjetgUTc7BEITReGDiaCeYf0dH97Bo" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Portal · Games &amp; Apps</title>
<meta property="og:type" content="website">
<meta property="og:title" content="App-Portal">
<meta property="og:description" content="Explore Iurii Medynskii’s Retro Waves arcade games and web apps.">
<meta property="og:url" content="https://mjv1981-art.github.io/App-Portal/">
<meta property="og:image" content="https://mjv1981-art.github.io/App-Portal/assets/covers/app-portal.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="450">

    <style>
        * { box-sizing: border-box; }
        :root { color-scheme: dark; --background: #0c1120; --surface: #141d30; --border: #293850; --text: #edf3ff; --muted: #aab8cb; --accent: #acbaff; }
        body { margin: 0; background: var(--background); color: var(--text); font: 1rem/1.5 system-ui, sans-serif; }
        .container { width: min(1200px, calc(100% - 2rem)); margin-inline: auto; }
        header { padding: 3rem 0 1.5rem; background: linear-gradient(140deg, #171e3d, var(--background) 68%); }
        h1 { font-size: clamp(2.7rem, 6vw, 4.5rem); letter-spacing: -.07em; line-height: 1; margin: 0 0 .8rem; }
        header p { margin: 0 0 1.5rem; color: var(--muted); }
        .filters { display: flex; flex-wrap: wrap; gap: .5rem; }
        button, summary, .button { cursor: pointer; }
        button, .button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: .55rem; padding: .55rem .85rem; font: inherit; text-decoration: none; }
        button:hover, .button:hover { border-color: var(--accent); }
        [aria-pressed="true"], .primary { background: var(--accent); border-color: var(--accent); color: #10172c; font-weight: 650; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
        #result-count { color: var(--muted); margin: .25rem 0 1rem; }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 1.1rem; align-items: stretch; }
        .app-card { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; }
        .app-media { position: relative; background: #0b1221; aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; }
        .app-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0b1221; }
        .media-fallback { color: var(--muted); font-size: .9rem; text-align: center; padding: .75rem; }
        .app-content { padding: 1rem 1.1rem; display: flex; flex: 1; flex-direction: column; align-items: flex-start; }
        h2 { font-size: 1.3rem; line-height: 1.25; margin: .55rem 0 .35rem; }
        .tags, .app-actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
        .tag { color: var(--muted); border: 1px solid var(--border); border-radius: 1rem; padding: .12rem .55rem; font-size: .76rem; }
        .tag.family { color: #d2c8ff; background: #272343; border-color: #423a65; }
        .app-description { color: var(--muted); margin: 0 0 1rem; }
        .app-actions { margin-top: auto; }
        .app-qr { margin-top: .65rem; color: var(--muted); font-size: .85rem; }
        .app-qr a { display: inline-block; margin-top: .5rem; }
        .app-qr img { display: block; border-radius: .3rem; }
        .local-visibility { margin-top: .55rem; color: var(--muted); font-size: .85rem; }
        footer { padding: 2rem 0; color: var(--muted); }
        footer details label { display: inline-flex; gap: .4rem; align-items: center; margin-top: .6rem; }
        dialog { width: min(760px, calc(100% - 1.5rem)); max-height: calc(100% - 1.5rem); padding: 1rem; border: 1px solid var(--border); border-radius: 1rem; background: var(--surface); color: var(--text); }
        dialog::backdrop { background: #030710d9; }
        .dialog-header { display: flex; gap: .75rem; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
        .dialog-header h2 { margin: 0; }
        dialog video { width: 100%; max-height: 70vh; background: #0b1221; display: block; }
        dialog video[hidden] { display: none; }
        #preview-message { color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>App Portal</h1>
            <p>Browse games, web apps, and community projects.</p>
            <nav class="filters" aria-label="Filter projects">
                <button type="button" data-filter="all" aria-pressed="true">All projects</button>
                <button type="button" data-filter="games" aria-pressed="false">Games</button>
                <button type="button" data-filter="apps" aria-pressed="false">Apps</button>
                <button type="button" data-filter="community" aria-pressed="false">Community</button>
            </nav>
        </div>
    </header>
    <main class="container">
        <p id="result-count" aria-live="polite"></p>
        <div class="apps-grid" id="apps-container"></div>
    </main>
    <footer class="container">
        <details>
            <summary>Manage listing on this device</summary>
            <label><input type="checkbox" id="manage-visibility"> Show hidden projects and visibility controls</label>
        </details>
    </footer>
    <dialog id="preview-dialog" aria-labelledby="preview-title">
        <div class="dialog-header">
            <h2 id="preview-title"></h2>
            <form method="dialog"><button type="submit">Close</button></form>
        </div>
        <video muted playsinline controls preload="none"></video>
        <p id="preview-message" role="status" hidden></p>
    </dialog>
    <script>
        const apps = [
            { id: 1, title: "Iurii M Repertoir", description: "A personal song repertoire with playable tracks. This app helps me organize and practice songs I can play and sing.", url: "https://mjv1981-art.github.io/Iurii-M-Repertoir/", published: true, kind: "app", cover: "iurii-m-repertoir-accordion" },
            { id: 2, title: "Hamsterland Declaration", description: "A fun declaration for my kids about the rules and joys of Hamsterland. Created to make rules more engaging for children.", url: "https://mjv1981-art.github.io/hamsterland-site/index.html", published: true, kind: "app", cover: "hamsterland-declaration" },
            { id: 3, title: "Pet Rat Monya", description: "A virtual pet app for my daughter to take care of her digital pet rat. Teaches responsibility and care for animals.", url: "https://mjv1981-art.github.io/pet-rat-monya/", published: false, kind: "app", cover: "pet-rat-monya-hooded" },
            { id: 4, title: "Snake Game", description: "Collect food, grow your snake, and avoid hitting the walls or your tail.", url: "https://mjv1981-art.github.io/snake-game-simple/", published: true, kind: "game", family: "Retro Waves", cover: "snake-game" },
            { id: 5, title: "Paste Helper", description: "Clean up pasted text, strip bullet markers, and convert Excel rows to CSV.", url: "https://mjv1981-art.github.io/Paste-Helper/", published: true, kind: "app", cover: "paste-helper" },
            { id: 6, title: "MFU Generator", description: "Creates meeting follow ups out of text, transcript or session recording.", url: "https://jumbo.ninja/", published: true, kind: "app", cover: "mfu-generator", community: true },
            { id: 7, title: "Asteroid Shooter", description: "Rotate your ship and blast asteroids as they close in.", url: "https://mjv1981-art.github.io/Asteroid-Shooter/", published: true, kind: "game", family: "Retro Waves", cover: "asteroid-shooter" },
            { id: 8, title: "Battle Cannons", description: "Aim over the terrain and trade artillery shots against the computer.", url: "https://mjv1981-art.github.io/Battle-Cannon/", published: true, kind: "game", family: "Retro Waves", cover: "battle-cannons" },
            { id: 9, title: "Wall Guard", description: "Defend a pixel-art fortress wall from waves of climbers.", url: "https://wall-guard-retro.base44.app/", published: true, kind: "game", family: "Retro Waves", cover: "wall-guard" },
            { id: 10, title: "Mind Flow", description: "Sign in to use MindFlow.", url: "https://shrewd-mind-flow-app.base44.app/", published: true, kind: "app", cover: "mind-flow-map", signInRequired: true },
            { id: 11, title: "Galaxy Capital", description: "Build a space empire by trading properties and competing against AI rivals.", url: "https://galaxy-capital-go.base44.app", published: true, kind: "game", family: "Retro Waves", cover: "galaxy-capital" },
            { id: 12, title: "Math Heroes", description: "An interactive, gamified platform that helps kids master math skills through fun challenges, leveled progress, and exciting rewards.", url: "https://math-heroes-quest.base44.app/", published: true, kind: "app", cover: "math-heroes" },
            { id: 13, title: "BudgetWise", description: "Effortlessly manage your personal and household budgets.", url: "https://fragrant-wise-budget-track.base44.app", published: true, kind: "app", cover: "budgetwise", signInRequired: true },
            { id: 14, title: "KnowVerse", description: "Интерактивная образовательная платформа для детей.", url: "https://know-verse-learn.base44.app", published: true, kind: "app", cover: "knowverse" },
            { id: 15, title: "Retro Waves Starfall", description: "A horizontal space shooter through asteroid belts and alien worlds.", url: "https://mjv1981-art.github.io/retro-waves-starfall/", published: true, kind: "game", family: "Retro Waves", cover: "retro-waves-starfall" },
            { id: 16, title: "Starfall Pulse", description: "A portrait Retro Waves space shooter with touch controls, five flight stages, and an unlockable ship hangar.", url: "https://mjv1981-art.github.io/App-Portal/starfall-pulse/", published: true, kind: "game", family: "Retro Waves", cover: "starfall-pulse" },
            { id: 17, title: "Hamster Hit", description: "A fast whack-a-hamster arcade game with bright knockout effects, streaks, and a Stampede round.", url: "https://mjv1981-art.github.io/Hamster-Hit/", published: true, kind: "game", family: "Retro Waves", cover: "hamster-hit" }
        ];

        const grid = document.getElementById('apps-container');
        const filters = document.querySelector('.filters');
        const count = document.getElementById('result-count');
        const manage = document.getElementById('manage-visibility');
        const dialog = document.getElementById('preview-dialog');
        const video = dialog.querySelector('video');
        const previewMessage = document.getElementById('preview-message');
        let currentFilter = 'all';

        function applySavedVisibility() {
            try {
                const saved = JSON.parse(localStorage.getItem('myWebApps') || '[]');
                if (!Array.isArray(saved)) return;
                for (const entry of saved) {
                    const app = apps.find(item => item.id === entry?.id);
                    if (app && typeof entry.published === 'boolean') app.published = entry.published;
                }
            } catch (error) {
                console.warn('Could not load project visibility.', error);
            }
        }

        function addFamilyFilters() {
            const families = new Set(apps.map(app => app.family).filter(Boolean));
            for (const family of families) {
                const button = document.createElement('button');
                button.type = 'button';
                button.dataset.filter = `family:${family}`;
                button.setAttribute('aria-pressed', 'false');
                button.textContent = family;
                filters.insertBefore(button, filters.querySelector('[data-filter="community"]'));
            }
        }

        function matchesFilter(app) {
            switch (currentFilter) {
                case 'all': return true;
                case 'games': return app.kind === 'game';
                case 'apps': return app.kind === 'app';
                case 'community': return app.community === true;
                default: return currentFilter === `family:${app.family}`;
            }
        }

        function makeCard(app) {
            const card = document.createElement('article');
            const media = `./assets/previews/${app.id}`;
            const cover = app.cover ? `./assets/covers/${app.cover}.jpg` : `${media}.jpg`;
            const launchText = app.kind === 'game' ? 'Play' : 'Open app';
            card.className = 'app-card';
            card.innerHTML = `
                <div class="app-media">
                    <span class="media-fallback">Screenshot unavailable</span>
                    <img src="${cover}" alt="" width="640" height="360" loading="lazy" decoding="async">
                </div>
                <div class="app-content">
                    <div class="tags">
                        <span class="tag">${app.kind === 'game' ? 'Game' : 'App'}</span>
                        ${app.family ? `<span class="tag family">${app.family}</span>` : ''}
                        ${app.community ? '<span class="tag">Community project</span>' : ''}
                        ${app.signInRequired ? '<span class="tag">Sign-in required</span>' : ''}
                    </div>
                    <h2>${app.title}</h2>
                    <p class="app-description">${app.description}</p>
                    <div class="app-actions">
                        <a class="button primary" href="${app.url}" target="_blank" rel="noopener noreferrer" aria-label="${launchText} ${app.title}">${launchText}</a>
                        ${app.signInRequired ? '' : `<button type="button" class="preview-button" aria-label="Preview ${app.title} (5 seconds)">Preview · 5 sec</button>`}
                    </div>
                    <details class="app-qr">
                        <summary>Phone QR code</summary>
                        <a href="${app.url}" target="_blank" rel="noopener noreferrer" aria-label="Open ${app.title}">
                            <img src="./assets/app-qr/${app.id}.png" width="144" height="144" alt="" loading="lazy" decoding="async">
                        </a>
                    </details>
                </div>`;
            const image = card.querySelector('.app-media img');
            const fallback = card.querySelector('.media-fallback');
            image.addEventListener('load', () => { fallback.hidden = true; });
            image.addEventListener('error', () => { image.remove(); });
            card.querySelector('.preview-button')?.addEventListener('click', () => openPreview(app, media));
            if (manage.checked) {
                const label = document.createElement('label');
                const checkbox = document.createElement('input');
                label.className = 'local-visibility';
                checkbox.type = 'checkbox';
                checkbox.checked = app.published;
                checkbox.setAttribute('aria-label', `List ${app.title} on this device`);
                checkbox.addEventListener('change', () => saveVisibility(app, checkbox.checked));
                label.append(checkbox, ' Show on this device');
                card.querySelector('.app-content').append(label);
            }
            return card;
        }

        function openPreview(app, media) {
            document.getElementById('preview-title').textContent = app.title;
            previewMessage.hidden = true;
            video.hidden = false;
            video.poster = `${media}.jpg`;
            video.src = `${media}.mp4`;
            video.muted = true;
            dialog.showModal();
            video.play().catch(() => {});
        }

        video.addEventListener('error', () => {
            if (!dialog.open) return;
            video.hidden = true;
            previewMessage.textContent = 'This preview is unavailable.';
            previewMessage.hidden = false;
        });

        dialog.addEventListener('close', () => {
            video.pause();
            video.removeAttribute('src');
            video.load();
        });

        function renderApps() {
            const visible = apps.filter(app => (app.published || manage.checked) && matchesFilter(app));
            count.textContent = visible.length === 1 ? '1 project' : `${visible.length} projects`;
            grid.replaceChildren(...visible.map(makeCard));
            if (visible.length) return;
            const empty = document.createElement('p');
            empty.textContent = 'No projects in this view.';
            grid.append(empty);
        }

        function saveVisibility(app, published) {
            app.published = published;
            try {
                localStorage.setItem('myWebApps', JSON.stringify(apps.map(item => ({ id: item.id, published: item.published }))));
            } catch (error) {
                console.warn('Could not save project visibility.', error);
            }
        }

        filters.addEventListener('click', event => {
            const selected = event.target.closest('button[data-filter]');
            if (!selected) return;
            currentFilter = selected.dataset.filter;
            for (const button of filters.querySelectorAll('button')) {
                button.setAttribute('aria-pressed', String(button === selected));
            }
            renderApps();
        });
        manage.addEventListener('change', renderApps);
        applySavedVisibility();
        addFamilyFilters();
        renderApps();
    </script>
</body>
</html>
